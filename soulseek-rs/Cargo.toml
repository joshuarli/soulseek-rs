[package]
name = "soulseek-rs"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line client for Soulseek protocol"
keywords = ["soulseek", "p2p", "client", "file-sharing"]
categories = ["command-line-utilities"]

[[bin]]
name = "soulseek-rs"
path = "src/main.rs"

# Small library target so integration tests can exercise the persistence
# pipeline; the dependency soulseek-rs-lib already owns the `soulseek_rs`
# crate name, hence the distinct one.
[lib]
name = "soulseek_rs_tui"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
soulseek-rs-lib = { version = "19.1.0", path = "../soulseek-rs-lib" }

lexopt = "0.3"
ratatui = "0.30.2"
unicode-width = "0.2"
dotenv = "0.15.0"
deser = { version = "0.10.2", features = ["derive"] }
deser-json = "0.10.2"
deser-toml = "0.10.2"
deser-value = "0.10.2"
h12tiny = { version = "0.7.0", default-features = false, features = ["client-sync"] }
log = "0.4"
rand = "0.10"
xmltree = "0.10"
directories = "6"
getrandom = "0.4.3"
libc = "0.2.189"

[dev-dependencies]
schemars = "1.2.1"
serde_json = "1"
tempfile = "3"
