[package]
name = "soulseek-rs"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line client for Soulseek protocol"
keywords = ["soulseek", "p2p", "client", "file-sharing"]
categories = ["command-line-utilities"]

[[bin]]
name = "soulseek-rs"
path = "src/main.rs"

# Small library target so integration tests can exercise the persistence
# pipeline; the dependency soulseek-rs-lib already owns the `soulseek_rs`
# crate name, hence the distinct one.
[lib]
name = "soulseek_rs_tui"
path = "src/lib.rs"

[features]
default = []
# A deterministic session and a binary that renders the real window over it,
# for the PTY capture tests. Not part of a normal build.
fixtures = []

[[bin]]
name = "tui-fixture"
path = "src/bin/tui_fixture.rs"
required-features = ["fixtures"]

[lints]
workspace = true

[dependencies]
soulseek-rs-lib = { version = "19.1.0", path = "../soulseek-rs-lib" }

lexopt = "0.3"
kasuari = "0.4.12"
unicode-width = "0.2"
deser = { version = "0.10.2", features = ["derive"] }
deser-json = "0.10.2"
deser-toml = "0.10.2"
deser-value = "0.10.2"
h12tiny = { version = "0.7.0", default-features = false, features = ["client-sync"] }
log = "0.4"
fastrand = "2.5.0"
xmltree = "0.10"
directories = "6"
getrandom = "0.4.3"
libc = "0.2.189"
rustix = { version = "1.1", features = ["termios", "event"] }

[dev-dependencies]
laputa-ptytest = "0.3"
schemars = "1.2.1"
serde_json = "1"
tempfile = "3"
