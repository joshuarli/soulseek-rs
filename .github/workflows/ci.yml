name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test:
    name: test
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: make test

  integration:
    name: server integration
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: build soulfind
        run: |
          sudo apt-get update
          sudo apt-get install -y dub ldc libsqlite3-dev
          git clone --depth 1 https://github.com/soulfind-dev/soulfind.git "$RUNNER_TEMP/soulfind"
          cd "$RUNNER_TEMP/soulfind"
          dub build :server
      - name: server-backed tests
        env:
          SOULFIND_BIN: ${{ runner.temp }}/soulfind/bin/soulfind
          SOULSEEK_E2E_REQUIRED: "1"
        run: make test
